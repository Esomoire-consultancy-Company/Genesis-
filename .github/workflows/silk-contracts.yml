name: SILK contract verification

on:
  pull_request:
    paths:
      - "contracts/silk/**"
      - "docs/architecture/SILK-*.md"
      - "tests/contracts/**"
      - "tests/fixtures/silk/**"
      - ".github/workflows/silk-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install contract validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format-nongpl]==4.26.0"

      - name: Compile contract tests
        run: python -m compileall -q tests/contracts

      - name: Run SILK contract tests
        run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
